# Publishes to PyPI with trusted publishing (OIDC, no stored token) when a
# GitHub release is published. Inert until a PyPI trusted publisher and the
# protected "pypi" environment exist (docs/pypi-publishing.md). Every run
# waits for manual approval on that environment.
name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]" tzdata
      - run: python scripts/validate.py
      - run: python scripts/sync_resources.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/check_artifacts.py --dist dist
      - name: Refuse a tag that does not match the package version
        run: |
          python -c "import sys,tomllib;v=tomllib.load(open('pyproject.toml','rb'))['project']['version'];t='${{ github.event.release.tag_name }}'.lstrip('v');sys.exit(0 if v==t else f'tag {t} != version {v}')"
      - run: rm dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/olympus-pantheon
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
