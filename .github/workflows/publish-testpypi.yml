# Rehearsal: publishes to TestPyPI (test.pypi.org) with trusted publishing.
# Run manually from Actions. Inert until a TestPyPI pending publisher and the
# protected "testpypi" environment exist (docs/pypi-publishing.md). A version
# uploaded to TestPyPI can never be uploaded there again.
name: Publish to TestPyPI (rehearsal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]" tzdata
      - run: python scripts/validate.py
      - run: python scripts/sync_resources.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/check_artifacts.py --dist dist
      - run: rm dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/olympus-pantheon
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: built/
      - name: Download this run's wheel from TestPyPI only and compare bytes
        run: |
          set -eu
          wheel=$(ls built/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          for i in 1 2 3 4 5 6 7 8; do
            if python -m pip download --no-deps --only-binary :all: --index-url https://test.pypi.org/simple/ \
                 "olympus-pantheon==$version" -d fetched/; then break; fi
            sleep 30
          done
          test -f "fetched/$(basename "$wheel")"
          cmp "$wheel" "fetched/$(basename "$wheel")"
          echo "TestPyPI serves the exact wheel this run built (olympus-pantheon $version)."
      - name: Install that wheel file (dependencies from PyPI) and run the CLI
        run: |
          python -m pip install fetched/*.whl
          pantheon version
          pantheon install --preset full
