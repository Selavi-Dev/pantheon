# Rehearsal: publishes to TestPyPI (test.pypi.org) with trusted publishing.
# Run manually from Actions. Inert until a TestPyPI pending publisher and the
# protected "testpypi" environment exist (docs/pypi-publishing.md). A version
# uploaded to TestPyPI can never be uploaded there again.
name: Publish to TestPyPI (rehearsal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]" tzdata
      - run: python scripts/validate.py
      - run: python scripts/sync_resources.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/check_artifacts.py --dist dist
      - run: rm dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pantheon-agent
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from TestPyPI (dependencies from PyPI)
        run: |
          for i in 1 2 3 4 5 6; do
            python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "pantheon-agent==$(curl -s https://test.pypi.org/pypi/pantheon-agent/json | python -c 'import sys,json;print(json.load(sys.stdin)["info"]["version"])')" && break
            sleep 30
          done
      - run: pantheon version
      - run: pantheon install --preset full
