name: Build release candidates (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]' tzdata
      - run: python scripts/validate.py
      - run: python scripts/sync_resources.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/build_distributions.py --output dist/profiles
      - run: python scripts/check_artifacts.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: pantheon-release-candidate
          path: dist/
