[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pantheon-agent"
version = "0.3.0"
description = "Governed specialist profiles and installation tooling for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tyler Cromartie" }]
maintainers = [{ name = "Tyler Cromartie" }]
keywords = ["hermes-agent", "ai-agents", "agent-profiles", "governance", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["typer>=0.12,<1", "rich>=13,<16", "PyYAML>=6,<7"]

[project.urls]
Homepage = "https://github.com/Selavi-Dev/pantheon"
Source = "https://github.com/Selavi-Dev/pantheon"
Issues = "https://github.com/Selavi-Dev/pantheon/issues"
Changelog = "https://github.com/Selavi-Dev/pantheon/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Selavi-Dev/pantheon/blob/main/docs/installable-release.md"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<10"]

[project.scripts]
pantheon = "pantheon.cli:app"

[tool.setuptools.packages.find]
include = ["pantheon", "pantheon.*"]
namespaces = false

[tool.setuptools.package-data]
pantheon = ["resources/**/*", "resources/profiles/*/.gitignore"]
